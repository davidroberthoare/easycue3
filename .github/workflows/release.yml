name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string
      publish:
        description: 'Publish the release immediately (default: create a private draft)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    env:
      # PDFium binaries from bblanchon/pdfium-binaries, pinned to chromium/7881
      # to match pdfium-render 0.9.3's pdfium_7881 bindings. Bundled into the
      # package's lib/ dir so users don't install anything.
      PDFIUM_URL: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-linux-x64.tgz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --no-default-features --features audio,usb,remote

      - name: Download PDFium
        run: |
          curl -L -o pdfium.tgz "$PDFIUM_URL"
          tar xzf pdfium.tgz lib/libpdfium.so

      - name: Package
        run: |
          PKG=easycue3-linux-x86_64
          mkdir -p $PKG/lib
          cp target/release/easycue3 $PKG/
          cp lib/libpdfium.so $PKG/lib/
          cp -r media shows fixture_profiles $PKG/
          tar czf $PKG.tar.gz $PKG/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: easycue3-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    env:
      PDFIUM_URL: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-win-x64.tgz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --no-default-features --features audio,usb,remote

      - name: Download PDFium
        shell: pwsh
        run: |
          curl.exe -L -o pdfium.tgz "$env:PDFIUM_URL"
          tar -xzf pdfium.tgz bin/pdfium.dll

      - name: Package
        shell: pwsh
        run: |
          $PKG = "easycue3-windows-x86_64"
          New-Item -ItemType Directory -Path $PKG
          Copy-Item target\release\easycue3.exe $PKG\
          New-Item -ItemType Directory -Path $PKG\lib
          Copy-Item bin\pdfium.dll $PKG\lib\
          Copy-Item -Recurse media, shows, fixture_profiles $PKG\
          Compress-Archive -Path $PKG -DestinationPath "$PKG.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: easycue3-windows-x86_64.zip

  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    env:
      PDFIUM_URL: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-mac-univ.tgz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build x86_64
        run: cargo build --release --no-default-features --features audio,usb,remote --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --no-default-features --features audio,usb,remote --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create -output easycue3 \
            target/x86_64-apple-darwin/release/easycue3 \
            target/aarch64-apple-darwin/release/easycue3

      - name: Download PDFium
        run: |
          curl -L -o pdfium.tgz "$PDFIUM_URL"
          tar xzf pdfium.tgz lib/libpdfium.dylib

      - name: Package
        run: |
          PKG=easycue3-macos-universal
          mkdir -p $PKG/lib
          cp easycue3 $PKG/
          cp lib/libpdfium.dylib $PKG/lib/
          cp -r media shows fixture_profiles $PKG/
          zip -r $PKG.zip $PKG/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: easycue3-macos-universal.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Prepare release notes
        run: |
          # Take the top-most (latest) section of docs/RELEASE_NOTES.md as the
          # release body, falling back to GitHub's auto-generated notes if the
          # section is missing.
          awk '/^## v/{ if (seen) exit; seen=1 } { print }' \
            docs/RELEASE_NOTES.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then echo "## Auto-generated notes" > RELEASE_BODY.md; fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            linux/easycue3-linux-x86_64.tar.gz
            windows/easycue3-windows-x86_64.zip
            macos/easycue3-macos-universal.zip
          generate_release_notes: true
          # Draft by default: a tag push never puts a release in front of the
          # public until it's been tested. Download the artifacts from the
          # draft, and publish from the release page (or
          # `gh release publish v0.8.5`) when ready. Roll back by deleting the
          # draft + tag. Dispatch with publish=true to skip the draft step.
          draft: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
